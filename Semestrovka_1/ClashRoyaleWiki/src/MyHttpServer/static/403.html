<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 — Доступ запрещён | Clash Royale Wordle</title>
</head>
<body class="page">

<main class="page__main page__main--centered">
    <div class="royale-board royale-board--narrow royale-board--details error-card">
        <div class="error-card__code">403</div>
        <h1 class="board-header__title">Доступ запрещён</h1>
        <p class="error-card__text">
            Запрошенный путь недоступен. Вы можете вернуться к библиотеке карт и продолжить работу.
        </p>
        <div class="error-card__actions">
            <a class="btn btn--gold" href="/cards">Вернуться в каталог карт</a>
        </div>
    </div>
</main>
</body>
</html>
