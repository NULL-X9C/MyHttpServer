services:
  postgres:
    image: postgres:16-alpine
    container_name: clash_royale_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clash_royale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clash_royale"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clash_royale_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "+"
      SERVER_PORT: "8080"
      DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=clash_royale;Username=postgres;Password=postgres"

volumes:
  pg_data: